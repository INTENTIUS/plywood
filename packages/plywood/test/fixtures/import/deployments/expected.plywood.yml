# yaml-language-server: $schema=https://intentius.io/plywood/plywood.schema.json
#
# plywood.yml, written by plywood init. init reads each Pulumi.yaml and its
# Pulumi.<stack>.yaml files, the backend and the forge from the repository,
# so this file holds only what it could not settle there. Add a key to
# change a default; every key is at https://intentius.io/plywood/reference/config/
# Run plywood init again after adding a stack; it keeps this file as it is.
stacks:
  shop/dev:
    dir: infra
    paths:
      - infra/**
  shop/prod:
    dir: infra
    paths:
      - infra/**
branches:
  develop:
    - shop/dev
  main:
    - shop/prod
image: ghcr.io/acme/pulumi-runner:3.272.0
review_stacks:
  template: shop/prod
